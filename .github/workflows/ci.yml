name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran and ftnchek
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran ftnchek
          gfortran --version

      - name: Build and test
        env:
          REQUIRE_FTNCHEK: 1
        run: python3 test_game.py
