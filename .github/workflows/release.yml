name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release with prebuilt binaries
# of both difficulty-3 editions (tictac77-rules, tictac77-minimax).
# Pull requests that touch this file run everything except the publish step.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: tictac77-linux-x86_64
            ldflags: -static
          - os: macos-latest
            asset: tictac77-macos-arm64
            ldflags: -static-libgfortran -static-libgcc -static-libquadmath
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Test
        run: python3 test_game.py

      - name: Check tag matches VERS
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n "s/.*PARAMETER (VERS = '\([0-9.]*\)').*/\1/p" tictac.f)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERS $version in tictac.f"
            exit 1
          fi

      - name: Build release binaries
        run: |
          make LDFLAGS="${{ matrix.ldflags }}"
          tar -czf ${{ matrix.asset }}.tar.gz \
            tictac77-rules tictac77-minimax README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
