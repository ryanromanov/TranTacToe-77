<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 270" width="260" height="270" role="img" aria-label="A game of TranTacToe-77 on an amber terminal: the computer, playing O, moved first and has two in the top row, and the player is typing 1 3 to block">
  <title>A game of TranTacToe-77 on an amber terminal</title>
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .fg { fill: #ffb347; font: 400 14px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: pre; }
  </style>
  <rect width="260" height="270" rx="10" fill="#14100a"/>
  <circle cx="18" cy="15" r="4.5" fill="#3d3020"/>
  <circle cx="33" cy="15" r="4.5" fill="#3d3020"/>
  <circle cx="48" cy="15" r="4.5" fill="#3d3020"/>
  <g filter="url(#glow)">
    <text class="fg" y="30" xml:space="preserve">
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> |  O  |  O  |  _  |</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> |  _  |  X  |  _  |</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> |  _  |  _  |  _  |</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> </tspan>
    <tspan x="16" dy="18"> ( To retire, enter 0 0 )</tspan>
    <tspan x="16" dy="18">1 3</tspan>
    </text>
    <rect x="42" y="235" width="8" height="15" fill="#ffb347"/>
  </g>
</svg>
